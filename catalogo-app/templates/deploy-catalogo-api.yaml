apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: catalogo-api
  name: catalogo-api
spec:
  selector:
    matchLabels:
      app: catalogo-api
  strategy: {}
  template:
    metadata:
      labels:
        app: catalogo-api
    spec:
      containers:
      - image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        name: catalogo-api
        resources: 
          requests:
            cpu: "100m" # <- contra ESTE número calcula el HPA
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        ports:
        - containerPort: 8000
        env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: catalogo-db-secret
                key: MONGO_INITDB_ROOT_PASSWORD
        envFrom:
          - configMapRef:
              name: catalogo-api-config
status: {}
