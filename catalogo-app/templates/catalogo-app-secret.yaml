apiVersion: v1
kind: Secret
metadata:
  name: catalogo-db-secret
  labels:
    app: catalogo-api
type: Opaque
data:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.secrets.MONGO_INITDB_ROOT_USERNAME | b64enc | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.secrets.MONGO_INITDB_ROOT_PASSWORD | b64enc | quote }}