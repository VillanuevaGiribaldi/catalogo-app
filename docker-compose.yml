
networks:
  catalogo-net:
    name: catalogo-net
volumes:
  catalogo-db-data:
    name: catalogo-db-data
services:

  catalogo-db:
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    container_name: catalogo-db
    image:
      mongo:7
    env_file: .env.example
#    environment:
#      MONGO_INITDB_ROOT_USERNAME: catalogo_user 
#      MONGO_INITDB_ROOT_PASSWORD: catalogo_pass 
#      MONGO_INITDB_DATABASE: catalogodb
    networks:
      - catalogo-net
    volumes:
      - catalogo-db-data:/data/db
    healthcheck:
      test: 
        - CMD-SHELL 
        - mongosh --quiet --eval "db.adminCommand('ping').ok" || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  catalogo-api:
    cap_drop: [ALL]
    container_name: catalogo-api
    build: ./backend
    env_file: .env.example
    # environment:
    #   - DB_HOST=catalogo-db 
    #   - DB_PORT=27017 
    #   - DB_NAME=catalogodb 
    #   - DB_USER=catalogo_user 
    #   - DB_PASSWORD=catalogo_pass
    #   - APP_VERSION=v1 
    #   - ROOT_PATH=/api 
    #   - SEED_DEMO=true
    networks:
      - catalogo-net
    ports:
      - 8000:8000
    depends_on:
      catalogo-db: 
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c 
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  catalogo-frontend:
    cap_drop: [ALL]
    container_name: catalogo-frontend
    build: ./frontend
    env_file: .env.example
    # environment:
    #   - API_HOST=catalogo-api 
    #   - API_PORT=8000
    networks:
      - catalogo-net
    ports:
      - 3000:8080
    depends_on:
      catalogo-api:
        condition:  service_healthy
    healthcheck:
      test: 
        - CMD-SHELL
        - "wget http://localhost:3000/healthz || exit 1"
      interval: 1m30s
      timeout: 30s
      retries: 10
      start_period: 30s