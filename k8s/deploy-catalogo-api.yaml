apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: catalogo-api
  name: catalogo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogo-api
  strategy: {}
  template:
    metadata:
      labels:
        app: catalogo-api
    spec:
      containers:
      - image: camidock1/catalogo-api:v2
        name: catalogo-api
        resources: {}
        ports:
        - containerPort: 8000
        env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: catalogo-db-secret
                key: MONGO_INITDB_ROOT_PASSWORD
        envFrom:
          - configMapRef:
              name: catalogo-api-config
status: {}
