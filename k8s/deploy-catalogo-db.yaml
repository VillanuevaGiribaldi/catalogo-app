apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: catalogo-db
  name: catalogo-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo-db
  strategy: {}
  template:
    metadata:
      labels:
        app: catalogo-db
    spec:
      containers:
      - image: mongo:7
        name: mongo
        resources: {}
        ports:
          - containerPort: 27017
        env:
          - name: MONGO_INITDB_ROOT_USERNAME
            value: "catalogo_user"
          - name: MONGO_INITDB_ROOT_PASSWORD
            value: "catalogo_pass"
          - name: MONGO_INITDB_DATABASE
            value: "catalogodb"
status: {}
