apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: catalogo-db
  name: catalogo-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo-db
  strategy: {}
  template:
    metadata:
      labels:
        app: catalogo-db
    spec:
      containers:
      - image: mongo:7
        name: mongo
        resources: {}
        ports:
          - containerPort: 27017
        volumeMounts:
          - name: datos
            mountPath: /data/db
        env:
          - name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: catalogo-db-secret
                key: MONGO_INITDB_ROOT_USERNAME
          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: catalogo-db-secret
                key: MONGO_INITDB_ROOT_PASSWORD
          - name: MONGO_INITDB_DATABASE
            value: "catalogodb"
        envFrom:
          - configMapRef:
              name: catalogo-api-config
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: catalogo-db-pvc
status: {}
