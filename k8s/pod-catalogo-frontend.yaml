apiVersion: v1
kind: Pod
metadata:
  labels:
    run: catalogo-frontend
  name: catalogo-frontend
spec:
  containers:
  - image: camidock1/catalogo-frontend:v2
    name: catalogo-frontend
    resources: {}
    env:
      - name: API_HOST
        value: "catalogo-api"
      - name: API_PORT
        value: "8000"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
